[package]
name = "postlite-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
aes-gcm = "0.11.1"
cookie_store = "0.22.1"
keyring = "4.2.0"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "http2", "gzip", "brotli", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "rt"] }
url = "2.5.8"

[dev-dependencies]
tokio = { version = "1", features = ["macros"] }
