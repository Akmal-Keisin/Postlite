[package]
name = "postlite-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls", "charset", "http2", "gzip", "brotli", "multipart", "cookies"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs"] }
url = "2.5.8"
