[package]
name = "postlite"
version = "0.2.8"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
postlite-core = { path = "../postlite-core" }
tauri = { version = "2", features = [] }
serde_json = "1"
rfd = { version = "0.17", default-features = false, features = ["gtk3"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["cookies"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2.5.8"

[profile.release]
codegen-units = 1
lto = "thin"
strip = true
