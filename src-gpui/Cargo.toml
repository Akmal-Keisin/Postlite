[package]
name = "postlite-gpui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
base64 = "0.22"
chrono = "0.4"
postlite-core = { path = "../postlite-core" }
rand = "0.9"
regex = "1"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
